name: Build fork release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add compiled files to
        required: true
        default: v2.9.2

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            use_cross: true
            binary: realm
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            use_cross: true
            binary: realm
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04
            use_cross: true
            binary: realm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            use_cross: false
            binary: realm.exe
            archive: zip
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            use_cross: false
            binary: realm
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            use_cross: false
            binary: realm
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Update the websocket dependency
        run: cargo update -p lightws --precise 0.6.14
      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build with cross
        if: ${{ matrix.use_cross }}
        run: cross build --release --no-default-features --features default-ring --target ${{ matrix.target }}
      - name: Build natively
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --no-default-features --features default-ring --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/${{ matrix.target }}/release -czf realm-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} -DestinationPath realm-${{ matrix.target }}.zip
      - name: Save build asset
        uses: actions/upload-artifact@v4
        with:
          name: realm-${{ matrix.target }}
          path: realm-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Add packages to this fork's Release
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - name: Download successful platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: realm-*
          path: dist
          merge-multiple: true
      - name: Upload assets to this fork's Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
