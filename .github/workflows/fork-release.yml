name: Build fork release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add the compiled Linux file to
        required: true
        default: v2.9.2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Update the websocket dependency
        run: cargo update -p lightws --precise 0.6.14
      - name: Build Linux x86_64 binary
        run: cargo build --release --no-default-features --features default-ring --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: tar -C target/x86_64-unknown-linux-gnu/release -czf realm-x86_64-unknown-linux-gnu.tar.gz realm
      - name: Upload to this fork's Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag }}
          files: realm-x86_64-unknown-linux-gnu.tar.gz
